<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestor · Gustavo Torres Fotografías</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#492D77">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--deep:#492D77;--mag:#BB1E9F;--vio:#6F1DA3;--ora:#FF7F40;--ora-t:#E0692E;--tx:#1f1e1d;--tx2:#5f5e5a;--tx3:#8a8984;--bd:rgba(0,0,0,.1);--soft:#F6F4F9;--danger:#A32D2D;--ok:#3B6D11}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-size:15px;color-scheme:light}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid rgba(0,0,0,.18);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(111,29,163,.12)}
button{cursor:pointer;padding:9px 14px;border:1px solid rgba(0,0,0,.18);border-radius:8px;background:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--soft)}
button.bp{background:var(--deep);color:#fff;border-color:var(--deep)}
button.bp:hover{background:#3a2361}
button.bd{color:var(--danger);border-color:rgba(163,45,45,.35)}
button.ic{padding:8px 10px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;z-index:20}
header img{height:38px}
.nv{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.nv button{font-size:13px}
.nv button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.cd{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.mt{background:var(--soft);border-radius:10px;padding:12px}
.mt .l{font-size:12px;color:var(--tx2)}.mt .v{font-size:22px;font-weight:600}
.pl{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:14px}
.row:last-child{border-bottom:none}
.lb{font-size:12px;color:var(--tx2);display:block;margin:10px 0 4px;font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.grid{display:grid;gap:12px}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal>div{min-height:78px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:11px;overflow:hidden}
.ev{border-radius:4px;padding:2px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.muted{color:var(--tx2)}.sm{font-size:12px}
.err{font-size:13px;color:var(--danger);margin-top:6px;min-height:1em}
.ov{position:fixed;inset:0;background:rgba(20,10,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow-y:auto}
.md{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:18px 20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60}
.av{width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.clk{cursor:pointer}
.voz{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:14px;border-radius:14px;background:var(--deep);color:#fff;border:none;white-space:normal}
.voz:hover{background:#3a2361}
.vozic{width:52px;height:52px;border-radius:50%;background:var(--mag);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.mic{width:84px;height:84px;border-radius:50%;background:var(--deep);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;margin:6px auto;justify-content:center}
.mic.on{background:var(--mag);box-shadow:0 0 0 8px rgba(187,30,159,.18)}
.fx{border:1px dashed var(--ora-t)!important;background:#FFF6F0!important}
.iaok{border-color:rgba(111,29,163,.45)!important;background:#FBF8FE!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.hide{display:none!important}
@media(max-width:720px){.kan{grid-template-columns:1fr}.cal>div{min-height:58px;font-size:10px}.g2{grid-template-columns:1fr}header img{height:30px}.hdtx{display:none}}
</style>
</head>
<body>

<div id="loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center"><img src="logo.png" alt="Gustavo Torres Fotografías" style="width:260px;opacity:.9"></div>

<div id="login" class="hide">
  <div class="cd" style="width:100%;max-width:380px;padding:28px 24px">
    <img src="logo.png" alt="Gustavo Torres Fotografías" style="width:100%;max-width:300px;display:block;margin:0 auto 22px">
    <span class="lb">Email</span><input id="lem" type="email" autocomplete="username" placeholder="tu@email.com">
    <span class="lb">Contraseña</span><input id="lpw" type="password" autocomplete="current-password">
    <div class="err" id="ler"></div>
    <button class="bp" id="lbtn" style="width:100%;justify-content:center;margin-top:8px;padding:12px"><i class="ti ti-login"></i> Ingresar</button>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <img src="logo.png" alt="Gustavo Torres Fotografías">
    <div style="display:flex;gap:6px;align-items:center">
      <input id="q" placeholder="Buscar cliente o trabajo" style="max-width:220px;padding:8px 10px">
      <button class="ic" id="avbtn" title="Notificaciones" onclick="avisos()"><i class="ti ti-bell"></i></button>
      <button class="ic" id="bkbtn" title="Descargar backup en Excel"><i class="ti ti-download"></i><span class="hdtx">Backup</span></button>
      <span id="who" class="sm muted" style="display:flex;align-items:center;gap:4px"></span>
      <button class="ic" id="outbtn" title="Cerrar sesión"><i class="ti ti-logout"></i></button>
    </div>
  </header>
  <div class="nv" id="nv"></div>
  <div class="wrap" id="v"></div>
</div>
<div id="modal"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence, createUserWithEmailAndPassword, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc, getDocs, onSnapshot, serverTimestamp, enableIndexedDbPersistence, arrayUnion } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
import { getMessaging, getToken, isSupported as msgSoportado, onMessage } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-messaging.js";
import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-ai.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app-check.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsq4hOoYMv4sly5Wz8FMOgON7x4pgDrHU",
  authDomain: "gestor-fotografo.firebaseapp.com",
  projectId: "gestor-fotografo",
  storageBucket: "gestor-fotografo.firebasestorage.app",
  messagingSenderId: "73327030013",
  appId: "1:73327030013:web:e7d881788da3ba4c43d894"
};
const RECAPTCHA_SITE_KEY = "PEGAR_CLAVE_DEL_SITIO";
const MODELOS = ["gemini-2.5-flash","gemini-3.6-flash","gemini-2.5-flash-lite","gemini-2.0-flash"];
const fb = initializeApp(firebaseConfig);
try { if(!RECAPTCHA_SITE_KEY.startsWith("PEGAR")) initializeAppCheck(fb,{provider:new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),isTokenAutoRefreshEnabled:true}); } catch(e) { console.warn("App Check",e); }
const auth = getAuth(fb);
const db = getFirestore(fb);
try { enableIndexedDbPersistence(db); } catch(e) {}
const ai = getAI(fb,{backend:new GoogleAIBackend()});

const ET=[["consulta","Consulta","gray"],["presupuesto","Presupuesto","vio"],["senado","Señado","mag"],["sesion","Sesión hecha","deep"],["edicion","En edición","ora"],["entregado","Entregado","green"]];
const C={gray:["#F1EFE8","#444441"],vio:["#EFE3F8","#5A1786"],mag:["#F8E3F3","#8A1475"],deep:["#E9E4F2","#492D77"],ora:["#FFEBDF","#A4471A"],green:["#EAF3DE","#27500A"],red:["#FCEBEB","#791F1F"]};
const TIPOS=["15 años","Boda","Cumpleaños infantil","Cumpleaños","Sesión book","Bautismo","Comunión","Egresados","Embarazo","Evento deportivo","Evento empresarial","Otro"];
const ORIG=["WhatsApp","Instagram","Facebook","Llamada","Recomendación","En persona","Otro"];
const AV=["#492D77","#BB1E9F","#6F1DA3","#FF7F40"];
const MS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MC=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

let U=null, unsubs=[];
const S={gal:[],tab:"inicio",q:"",sel:null,cm:new Date(),cl:[],tr:[],ta:[],fin:{},miembros:[],me:null,filtroTa:"pend"};
const ADM=()=>S.me&&S.me.rol==="admin";
S.cm=new Date(S.cm.getFullYear(),S.cm.getMonth(),1);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Math.round(+n||0).toLocaleString("es-AR");
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=f=>{if(!f)return"sin fecha";const[y,m,d]=f.split("-");return d+"/"+m+"/"+y.slice(2)};
const pill=(t,c)=>`<span class="pl" style="background:${C[c][0]};color:${C[c][1]}">${esc(t)}</span>`;
const et=k=>ET.find(e=>e[0]==k)||ET[0];
const cli=id=>S.cl.find(c=>c.id==id)||{nombre:"(cliente borrado)",telefono:""};
const fin=t=>S.fin[t.id]||{total:0,pagos:[]};
const pagado=t=>(fin(t).pagos||[]).reduce((s,p)=>s+(+p.monto||0),0);
const saldo=t=>(+fin(t).total||0)-pagado(t);
const col=n=>collection(db,n);
const dref=(n,id)=>doc(db,n,id);
const falta=t=>[!t.fecha&&"fecha",!t.hora&&"hora",!t.lugar&&"lugar"].filter(Boolean);
const firma=()=>({editadoPor:S.me?.nombre||"",editadoEn:serverTimestamp()});
const iniciales=n=>String(n||"?").split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const avc=id=>AV[[...String(id)].reduce((s,c)=>s+c.charCodeAt(0),0)%4];
const waLink=t=>{let n=String(t||"").replace(/\D/g,"");if(!n)return"";if(!n.startsWith("54"))n="549"+n;return"https://wa.me/"+n;};
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}

/* ---------- AUTH ---------- */
setPersistence(auth,browserLocalPersistence);
$("#lbtn").onclick=async()=>{
  const em=$("#lem").value.trim(),pw=$("#lpw").value;$("#ler").textContent="";
  if(!em||!pw){$("#ler").textContent="Completá email y contraseña";return;}
  $("#lbtn").disabled=true;
  try{await signInWithEmailAndPassword(auth,em,pw);}catch(e){$("#ler").textContent="Email o contraseña incorrectos";}
  $("#lbtn").disabled=false;
};
$("#lpw").onkeydown=e=>{if(e.key==="Enter")$("#lbtn").click();};
$("#outbtn").onclick=()=>{if(confirm("¿Cerrar sesión?"))signOut(auth);};
function sinAcceso(msg){$("#loading").classList.add("hide");$("#app").classList.add("hide");$("#login").classList.remove("hide");$("#ler").textContent=msg;signOut(auth);}
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];U=u;S.me=null;S.fin={};S.miembros=[];
  if(!u){$("#loading").classList.add("hide");$("#app").classList.add("hide");$("#login").classList.remove("hide");return;}
  let m=null;
  try{const d=await getDoc(dref("miembros",u.uid));if(d.exists())m=d.data();}catch(e){}
  if(!m){
    try{m={nombre:"Gustavo",email:u.email,rol:"admin",activo:true};await setDoc(dref("miembros",u.uid),{...m,creado:serverTimestamp()});}
    catch(e){return sinAcceso("Esta cuenta no tiene acceso. Pedile al administrador que te habilite.");}
  }
  if(!m.activo)return sinAcceso("Tu acceso fue desactivado. Consultá con el administrador.");
  S.me={uid:u.uid,...m};
  $("#loading").classList.add("hide");$("#login").classList.add("hide");$("#app").classList.remove("hide");
  $("#bkbtn").classList.toggle("hide",!ADM());
  $("#who").innerHTML=`<i class="ti ti-user-circle"></i><span class="hdtx">${esc(S.me.nombre)}${ADM()?"":" · Secretario/a"}</span>`;
  marcarCampana();
  msgSoportado().then(ok=>{if(ok){msg=msg||getMessaging(fb);onMessage(msg,p=>toast((p.notification?.title||"Aviso")+": "+(p.notification?.body||"").split("\n")[0]));}}).catch(()=>{});
  if(ADM())await migrar();
  const sub=(n,k)=>unsubs.push(onSnapshot(col(n),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));r();},e=>toast("Error de conexión: "+e.code)));
  sub("clientes","cl");sub("trabajos","tr");sub("tareas","ta");
  if(ADM()){
    unsubs.push(onSnapshot(col("finanzas"),s=>{S.fin={};s.docs.forEach(d=>S.fin[d.id]=d.data());r();}));
    sub("miembros","miembros");sub("galerias","gal");
  }
});

/* Pasa los datos de la versión anterior (carpeta personal) a la base compartida, una sola vez */
async function migrar(){
  try{
    const est=await getDoc(dref("config","estado"));if(est.exists()&&est.data().migrado)return;
    const old=n=>getDocs(collection(db,"usuarios",U.uid,n));
    const [oc,ot,oa]=await Promise.all([old("clientes"),old("trabajos"),old("tareas")]);
    for(const d of oc.docs)await setDoc(dref("clientes",d.id),d.data());
    for(const d of ot.docs){const {total,pagos,...resto}=d.data();await setDoc(dref("trabajos",d.id),resto);await setDoc(dref("finanzas",d.id),{total:+total||0,pagos:pagos||[]});}
    for(const d of oa.docs)await setDoc(dref("tareas",d.id),d.data());
    await setDoc(dref("config","estado"),{migrado:true,fecha:serverTimestamp()});
    if(oc.size||ot.size)toast("Tus datos se pasaron a la base compartida");
  }catch(e){toast("No se pudo migrar: "+(e.code||e.message));}
}

/* ---------- NAV ---------- */
function nav(){
  const t=[["inicio","Inicio","home"],["trabajos","Trabajos","briefcase"],["agenda","Agenda","calendar"],["clientes","Clientes","users"],["tareas","Tareas","checklist"]];if(ADM())t.push(["equipo","Equipo","users-group"]);
  $("#nv").innerHTML=t.map(x=>`<button class="${S.tab==x[0]||(S.tab=="detalle"&&x[0]=="trabajos")||(S.tab=="cliente"&&x[0]=="clientes")?"on":""}" data-go="${x[0]}"><i class="ti ti-${x[2]}"></i> ${x[1]}</button>`).join("");
}
window.go=t=>{S.tab=t;S.sel=null;r();window.scrollTo(0,0);};
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(b.dataset.go);});
$("#q").oninput=e=>{S.q=e.target.value;if(!["trabajos","clientes"].includes(S.tab))S.tab="clientes";r();};

/* ---------- VIEWS ---------- */
function trRow(t){
  const e=et(t.etapa);const f=t.fecha||"";
  return `<div class="row clk" onclick="verTr('${t.id}')"><div style="width:46px;text-align:center"><div style="font-weight:700;font-size:17px;color:var(--mag)">${f.slice(8)||"-"}</div><div class="sm muted">${f?MC[+f.slice(5,7)-1]:""}</div></div><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(cli(t.clienteId).nombre)}</div><div class="sm muted">${esc(t.tipo)} · ${esc(t.hora||"")} · ${esc(t.lugar||"")}</div></div>${pill(e[1],e[2])}</div>`;
}
function taRow(t){
  const H=hoy(),v=t.fecha&&t.fecha<H,h=t.fecha==H;const tr=t.trabajoId?S.tr.find(z=>z.id==t.trabajoId):null;
  return `<div class="row"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--deep)" ${t.hecha?"checked":""} onchange="tk('${t.id}',this.checked)"><div style="flex:1;min-width:0;${t.hecha?"text-decoration:line-through;color:var(--tx3)":""}">${esc(t.texto)}${tr?`<div class="sm muted clk" onclick="verTr('${tr.id}')">${esc(cli(tr.clienteId).nombre)} · ${esc(tr.tipo)}</div>`:""}</div>${v&&!t.hecha?pill("Vencida "+fd(t.fecha),"red"):h&&!t.hecha?pill("Hoy","ora"):`<span class="sm muted">${fd(t.fecha)}</span>`}<button class="ic" style="border:none" title="Borrar" onclick="delTa('${t.id}')"><i class="ti ti-trash" style="color:var(--tx3)"></i></button></div>`;
}
function inicio(){
  const H=hoy();const prox=S.tr.filter(t=>t.fecha>=H&&t.etapa!="entregado").sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).slice(0,6);
  const pend=S.ta.filter(t=>!t.hecha).sort((a,b)=>(a.fecha||"9").localeCompare(b.fecha||"9")).slice(0,8);
  const sal=S.tr.reduce((s,t)=>s+Math.max(0,saldo(t)),0);
  const edic=S.tr.filter(t=>t.etapa=="edicion"||t.etapa=="sesion").length;
  const mc=(l,v,c)=>`<div class="mt"><div class="l">${l}</div><div class="v" style="color:${c}">${v}</div></div>`;
  const vozBtn=`<button class="voz" onclick="voz()"><span class="vozic"><i class="ti ti-microphone"></i></span><span style="text-align:left"><b style="font-size:16px">Cargar por voz</b><br><span class="sm" style="opacity:.85">Contale a la app lo que te pidió el cliente</span></span></button>`;
  if(!S.cl.length&&!S.tr.length)return `${vozBtn}<div class="cd" style="text-align:center;padding:36px 20px"><i class="ti ti-camera" style="font-size:40px;color:var(--mag)"></i><h2 style="font-weight:600;margin:10px 0 6px">Cargá tu primer trabajo</h2><p class="muted" style="margin:0 0 16px">Registrá al cliente, la fecha, el servicio y lo que acordaron. Así no se te escapa nada.</p><button class="bp" onclick="formTr()"><i class="ti ti-plus"></i> Nuevo trabajo</button></div>`;
  const inc=S.tr.filter(t=>t.etapa!="entregado"&&falta(t).length);
  return `${vozBtn}${inc.length?`<div class="cd" style="margin-bottom:14px;border-color:rgba(224,105,46,.45);background:#FFFAF6"><b style="color:var(--ora-t)"><i class="ti ti-pencil"></i> Datos a completar (${inc.length})</b>${inc.map(t=>`<div class="row clk" onclick="verTr('${t.id}')"><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(cli(t.clienteId).nombre)} · ${esc(t.tipo)}</div><div class="sm" style="color:var(--ora-t)">Falta: ${falta(t).join(", ")}</div></div><i class="ti ti-chevron-right muted"></i></div>`).join("")}</div>`:""}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">${mc("Próximos trabajos",S.tr.filter(t=>t.fecha>=H).length,"var(--vio)")}${mc("Por editar o entregar",edic,"var(--mag)")}${ADM()?mc("Saldo a cobrar",money(sal),"var(--ora-t)"):""}${mc("Tareas pendientes",S.ta.filter(t=>!t.hecha).length,"var(--deep)")}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
  <div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><b>Próximos trabajos</b><button class="bp" onclick="formTr()"><i class="ti ti-plus"></i> Nuevo</button></div>${prox.map(trRow).join("")||'<p class="muted sm">No hay trabajos próximos.</p>'}</div>
  <div class="cd"><b>Para hacer</b>${pend.map(taRow).join("")||'<p class="muted sm">Todo al día.</p>'}</div></div>`;
}
function filtTr(){const q=S.q.toLowerCase().trim();return S.tr.filter(t=>!q||cli(t.clienteId).nombre.toLowerCase().includes(q)||String(t.tipo).toLowerCase().includes(q)||String(t.lugar||"").toLowerCase().includes(q));}
function trabajos(){
  const l=filtTr().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

function textoSemana(nombre){
  const H=hoy();const fin=new Date();fin.setDate(fin.getDate()+6);const F=fin.getFullYear()+"-"+String(fin.getMonth()+1).padStart(2,"0")+"-"+String(fin.getDate()).padStart(2,"0");
  const sem=S.tr.filter(t=>t.fecha&&t.fecha>=H&&t.fecha<=F).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const pend=S.ta.filter(t=>!t.hecha).sort((a,b)=>String(a.fecha||"9").localeCompare(String(b.fecha||"9")));
  const venc=pend.filter(t=>t.fecha&&t.fecha<H);const inc=S.tr.filter(t=>t.etapa!="entregado"&&falta(t).length);const ed=S.tr.filter(t=>t.etapa=="sesion"||t.etapa=="edicion");
  let s=`Hola ${nombre.split(" ")[0]}! Resumen de la semana 📸\n\n`;
  s+=sem.length?`*Trabajos de la semana*\n${sem.map(t=>`• ${fd(t.fecha)} ${t.hora||""} · ${t.tipo} · ${cli(t.clienteId).nombre}${t.lugar?" · "+t.lugar:""}`).join("\n")}\n\n`:"Sin trabajos agendados esta semana.\n\n";
  if(ed.length)s+=`*Por editar o entregar (${ed.length})*\n${ed.map(t=>`• ${cli(t.clienteId).nombre} · ${t.tipo}`).join("\n")}\n\n`;
  s+=`*Tareas pendientes (${pend.length}${venc.length?`, ${venc.length} vencidas`:""})*\n${pend.slice(0,12).map(t=>`• ${t.texto}${t.fecha?" ("+fd(t.fecha)+")":""}`).join("\n")||"Ninguna"}\n`;
  if(inc.length)s+=`\n*Datos a completar*\n${inc.map(t=>`• ${cli(t.clienteId).nombre} · ${t.tipo}: falta ${falta(t).join(", ")}`).join("\n")}\n`;
  return s+"\nGustavo Torres Fotografías";
}

let msg=null;
window.avisos=async()=>{
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(!("Notification" in window)||!(await msgSoportado().catch(()=>false))){
    modal(`${head("Activar avisos")}${ios&&!standalone?`<p>En iPhone, los avisos funcionan solo si la app está instalada en la pantalla de inicio:</p><ol style="padding-left:20px;line-height:1.8"><li>Abrí esta página en <b>Safari</b>.</li><li>Tocá el botón <b>Compartir</b> <i class="ti ti-share"></i>.</li><li>Elegí <b>"Agregar a pantalla de inicio"</b>.</li><li>Abrí la app desde el ícono nuevo y tocá otra vez la campanita.</li></ol>`:"<p>Este navegador no permite notificaciones. Probá con Chrome o instalá la app en la pantalla de inicio.</p>"}<button onclick="cerrar()">Entendido</button>`);return;}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Permiso de notificaciones rechazado. Activalo en los ajustes del navegador.");return;}
    const cfg=await fetch("/api/config").then(r=>r.json()).catch(()=>({}));
    if(!cfg.vapidKey){toast("Falta configurar la clave de avisos (VAPID) en Vercel");return;}
    const reg=await navigator.serviceWorker.register("/firebase-messaging-sw.js");
    msg=msg||getMessaging(fb);
    const token=await getToken(msg,{vapidKey:cfg.vapidKey,serviceWorkerRegistration:reg});
    if(!token){toast("No se pudo obtener el permiso del dispositivo");return;}
    await updateDoc(dref("miembros",U.uid),{tokens:arrayUnion(token)});
    localStorage.setItem("gt_avisos","1");marcarCampana();toast("Avisos activados en este dispositivo");
  }catch(e){toast("No se pudieron activar: "+(e.code||e.message));}
};
function marcarCampana(){const b=$("#avbtn");if(!b)return;let on=false;try{on=Notification.permission==="granted"&&localStorage.getItem("gt_avisos")==="1";}catch(e){}b.innerHTML=on?'<i class="ti ti-bell-ringing" style="color:var(--mag)"></i>':'<i class="ti ti-bell"></i>';b.title=on?"Avisos activados":"Activar avisos";}

  <span class="lb">Nombre</span><input id="mn" placeholder="Laura">
  <span class="lb">Email para entrar</span><input id="me" type="email" placeholder="laura@gmail.com" autocomplete="off">
  <span class="lb">WhatsApp (opcional, para mandarle el resumen semanal)</span><input id="mt" type="tel" placeholder="3725 40-0000">
  <span class="lb">Contraseña (mínimo 6 caracteres)</span><input id="mp" type="text" autocomplete="off" placeholder="Pasásela a la persona">
  <div class="err" id="mer"></div>
  <div style="display:flex;gap:6px;margin-top:10px"><button class="bp" id="mok"><i class="ti ti-check"></i> Crear acceso</button><button onclick="cerrar()">Cancelar</button></div>`);
  $("#mok").onclick=async()=>{
    const n=$("#mn").value.trim(),em=$("#me").value.trim(),pw=$("#mp").value;const er=m=>$("#mer").textContent=m;
    if(!n)return er("Ingresá el nombre");if(!em)return er("Ingresá el email");if(pw.length<6)return er("La contraseña necesita al menos 6 caracteres");
    $("#mok").disabled=true;
    try{
      if(!auth2){auth2=getAuth(initializeApp(firebaseConfig,"altas"));await setPersistence(auth2,inMemoryPersistence);}
      const cred=await createUserWithEmailAndPassword(auth2,em,pw);const uid=cred.user.uid;await signOut(auth2);
      await setDoc(dref("miembros",uid),{nombre:n,email:em,telefono:$("#mt").value.trim(),rol:"secretario",activo:true,creado:serverTimestamp()});
      cerrar();toast("Acceso creado para "+n);
    }catch(e){
      const msg={"auth/email-already-in-use":"Ese email ya tiene una cuenta","auth/invalid-email":"El email no es válido","auth/weak-password":"La contraseña es muy débil"}[e.code]||("No se pudo crear: "+(e.code||e.message));
      er(msg);$("#mok").disabled=false;
    }
  };
};

function r(){
  if(!U||!S.me)return;nav();
  if(S.tab==="equipo"&&!ADM())S.tab="inicio";
  const m={inicio,trabajos,agenda,clientes,tareas,detalle,cliente,equipo};
  const a=document.activeElement;const keep=a&&a.id==="nt"?{v:a.value}:null;
  $("#v").innerHTML=m[S.tab]();
  if(keep&&$("#nt")){$("#nt").value=keep.v;$("#nt").focus();}
  const nt=$("#nt");if(nt)nt.onkeydown=e=>{if(e.key==="Enter")nt.nextElementSibling.nextElementSibling.click();};
}

/* ---------- ACCIONES ---------- */
async function guardar(fn,msg){try{await fn();if(msg)toast(msg);return true;}catch(e){toast("No se pudo guardar: "+(e.code||e.message));return false;}}
window.tk=(id,v)=>guardar(()=>updateDoc(dref("tareas",id),{hecha:v}));
window.delTa=id=>{if(confirm("¿Borrar esta tarea?"))guardar(()=>deleteDoc(dref("tareas",id)),"Tarea borrada");};
window.addTa=trid=>{const x=$("#nt").value.trim();if(!x){$("#nt").focus();return;}guardar(()=>addDoc(col("tareas"),{texto:x,fecha:$("#ntf").value||hoy(),hecha:false,trabajoId:trid||null,creado:serverTimestamp()}),"Tarea agregada");$("#nt").value="";};
window.setE=(id,e)=>guardar(()=>updateDoc(dref("trabajos",id),{etapa:e,...firma()}),"Etapa: "+et(e)[1]);
window.delTr=id=>{if(!ADM())return;if(!confirm("¿Borrar este trabajo? Se borran también sus tareas y pagos. No se puede deshacer."))return;
  guardar(async()=>{for(const t of S.ta.filter(x=>x.trabajoId==id))await deleteDoc(dref("tareas",t.id));await deleteDoc(dref("finanzas",id));await deleteDoc(dref("trabajos",id));},"Trabajo borrado");go("trabajos");};
window.delCl=id=>{if(!ADM())return;const n=S.tr.filter(t=>t.clienteId==id).length;if(n){alert("Este cliente tiene "+n+" trabajo(s). Borralos primero.");return;}if(confirm("¿Borrar este cliente?")){guardar(()=>deleteDoc(dref("clientes",id)),"Cliente borrado");go("clientes");}};
window.delPago=(id,k)=>{if(!ADM()||!confirm("¿Quitar este pago?"))return;const p=[...(S.fin[id]?.pagos||[])];p.splice(k,1);guardar(()=>setDoc(dref("finanzas",id),{pagos:p},{merge:true}),"Pago quitado");};

/* ---------- MODALES ---------- */
function modal(html){$("#modal").innerHTML=`<div class="ov" onclick="if(event.target===this)cerrar()"><div class="md">${html}</div></div>`;document.body.style.overflow="hidden";}
window.cerrar=()=>{try{if(rec)rec.stop();}catch(e){}$("#modal").innerHTML="";document.body.style.overflow="";};
const opts=(arr,sel)=>arr.map(o=>`<option ${o==sel?"selected":""}>${esc(o)}</option>`).join("");
const head=t=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:17px;color:var(--deep)">${t}</b><button class="ic" style="border:none" onclick="cerrar()"><i class="ti ti-x"></i></button></div>`;

window.formTr=(id,clId)=>{
  const t=id?{...S.tr.find(x=>x.id==id),total:S.fin[id]?.total??""}:{etapa:"consulta",fecha:"",hora:"",total:""};const ini=id?t.clienteId:(clId||"");
  const clOpts=[...S.cl].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${c.id==ini?"selected":""}>${esc(c.nombre)}</option>`).join("");
  modal(`${head(id?"Editar trabajo":"Nuevo trabajo")}
  <span class="lb">Cliente</span><select id="fc">${S.cl.length?"":'<option value="">Sin clientes</option>'}${clOpts}<option value="new" ${!S.cl.length&&!id?"selected":""}>+ Cliente nuevo</option></select>
  <div id="fcn" style="display:${!S.cl.length&&!id?"block":"none"};background:var(--soft);padding:2px 12px 12px;border-radius:10px;margin-top:8px"><span class="lb">Nombre</span><input id="fcnn" placeholder="Carla Fernández"><div class="g2"><div><span class="lb">Teléfono</span><input id="fcnt" type="tel" placeholder="3725 40-0000"></div><div><span class="lb">Cómo llegó</span><select id="fcno">${opts(ORIG)}</select></div></div></div>
  <div class="g2"><div><span class="lb">Tipo de evento</span><select id="ft">${opts(TIPOS,t.tipo)}</select></div><div><span class="lb">Etapa</span><select id="fe">${ET.map(e=>`<option value="${e[0]}" ${e[0]==t.etapa?"selected":""}>${e[1]}</option>`).join("")}</select></div>
  <div><span class="lb">Fecha</span><input id="ff" type="date" value="${esc(t.fecha)}"></div><div><span class="lb">Hora</span><input id="fh" type="time" value="${esc(t.hora)}"></div>
  ${ADM()?`<div><span class="lb">Total del trabajo</span><input id="ftot" type="number" inputmode="numeric" step="1000" min="0" value="${esc(t.total)}" placeholder="300000"></div>${id?"":`<div><span class="lb">Seña recibida</span><input id="fsen" type="number" inputmode="numeric" step="1000" min="0" placeholder="0"></div>`}`:""}</div>
  <span class="lb">Lugar</span><input id="fl" value="${esc(t.lugar)}" placeholder="Salón Los Álamos">
  <span class="lb">Servicio contratado</span><input id="fp" value="${esc(t.servicio)}" placeholder="Book + fiesta + video">
  <span class="lb">Lo que se acordó</span><textarea id="fa" rows="4" placeholder="Entrega en 30 días, álbum 30x30, 300 fotos editadas">${esc(t.acordado)}</textarea>
  <div class="err" id="fer"></div>
  <div style="display:flex;gap:6px;margin-top:10px"><button class="bp" id="fok"><i class="ti ti-check"></i> Guardar</button><button onclick="cerrar()">Cancelar</button></div>`);
  $("#fc").onchange=e=>$("#fcn").style.display=e.target.value=="new"?"block":"none";
  $("#fok").onclick=async()=>{
    const er=m=>{$("#fer").textContent=m;};let c=$("#fc").value;
    if(c=="new"){const n=$("#fcnn").value.trim();if(!n)return er("Ingresá el nombre del cliente");}
    else if(!c)return er("Elegí un cliente");
        $("#fok").disabled=true;
    const ok=await guardar(async()=>{
      if(c=="new"){const d=await addDoc(col("clientes"),{nombre:$("#fcnn").value.trim(),telefono:$("#fcnt").value.trim(),origen:$("#fcno").value,instagram:"",notas:"",creado:serverTimestamp(),creadoPor:S.me.nombre,...firma()});c=d.id;}
      const data={clienteId:c,tipo:$("#ft").value,etapa:$("#fe").value,fecha:$("#ff").value,hora:$("#fh").value,lugar:$("#fl").value.trim(),servicio:$("#fp").value.trim(),acordado:$("#fa").value.trim(),...firma()};
      const total=ADM()?(+$("#ftot").value||0):null;
      if(id){await updateDoc(dref("trabajos",id),data);if(ADM())await setDoc(dref("finanzas",id),{total},{merge:true});}
      else{
        const sen=ADM()?(+$("#fsen").value||0):0;

  const c=id?S.cl.find(x=>x.id==id):{};
  modal(`${head(id?"Editar cliente":"Nuevo cliente")}
  <span class="lb">Nombre</span><input id="cn" value="${esc(c.nombre)}" placeholder="Carla Fernández">
  <div class="g2"><div><span class="lb">Teléfono</span><input id="ct" type="tel" value="${esc(c.telefono)}" placeholder="3725 40-0000"></div><div><span class="lb">Instagram</span><input id="ci" value="${esc(c.instagram)}" placeholder="@usuario"></div></div>
  <span class="lb">Cómo llegó</span><select id="co">${opts(ORIG,c.origen)}</select>

window.formPago=id=>{
  const t=S.tr.find(x=>x.id==id);

  <div class="g2"><div><span class="lb">Monto</span><input id="pm" type="number" inputmode="numeric" step="1000" min="0" value="${Math.max(0,saldo(t))||""}"></div><div><span class="lb">Fecha</span><input id="pf" type="date" value="${hoy()}"></div></div>

window.resumen=id=>{
  const t=S.tr.find(x=>x.id==id),c=cli(t.clienteId);
  const txt=`Hola ${c.nombre.split(" ")[0]}! Te paso el resumen de lo que acordamos:\n\n📸 ${t.tipo}\n📅 ${fd(t.fecha)}${t.hora?" a las "+t.hora+" hs":""}\n📍 ${t.lugar||"A definir"}\n\nServicio: ${t.servicio||"-"}\n${t.acordado?"Detalle: "+t.acordado+"\n":""}${ADM()?`\nTotal: ${money(fin(t).total)}\nPagado: ${money(pagado(t))}\nSaldo: ${money(saldo(t))}\n`:""}\nGracias por elegirnos!\nGustavo Torres Fotografías`;
  const wa=waLink(c.telefono);
  modal(`${head("Resumen para el cliente")}<textarea id="rs" rows="13">${esc(txt)}</textarea><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${wa?`<button class="bp" id="rwa"><i class="ti ti-brand-whatsapp"></i> Enviar por WhatsApp</button>`:'<span class="sm muted">El cliente no tiene teléfono cargado.</span>'}<button id="rcp"><i class="ti ti-copy"></i> Copiar</button></div>`);

/* ---------- ENTREGA DE FOTOS (GALERÍAS) ---------- */
async function apiAdm(body){const tk=await auth.currentUser.getIdToken();const r=await fetch("/api/galeria-admin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:"Respuesta inválida ("+r.status+")"}));if(!r.ok)throw Object.assign(new Error(j.error||("Error "+r.status)),j);return j;}
const galLink=g=>location.origin+"/g/"+g.id;
function galCard(t){
  const g=S.gal.find(x=>x.trabajoId==t.id);
  if(!g)return `<div class="cd" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><b><i class="ti ti-photo"></i> Entrega de fotos</b><div class="sm muted">Creá una galería con las fotos de Drive para mandarle al cliente.</div></div><button class="bp" onclick="formGal('${t.id}')"><i class="ti ti-plus"></i> Crear galería</button></div></div>`;
  const fin0=g.modo==="final";const sugerir=!fin0&&fin(t).total>0&&saldo(t)<=0;
  return `<div class="cd" style="margin-top:14px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b><i class="ti ti-photo"></i> Entrega de fotos</b>${fin0?pill("Entrega final","green"):pill("Muestra","ora")}</div>
  <div style="display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin:12px 0"><button onclick="galModo('${g.id}','muestra')" style="border:none;${fin0?"background:transparent":"background:var(--deep);color:#fff"}"><i class="ti ti-droplet"></i> Muestra</button><button onclick="galModo('${g.id}','final')" style="border:none;${fin0?"background:var(--deep);color:#fff":"background:transparent"}"><i class="ti ti-circle-check"></i> Entrega final</button></div>
  ${sugerir?`<div class="sm" style="background:#EAF3DE;color:#27500A;padding:8px 12px;border-radius:8px;margin-bottom:8px"><i class="ti ti-cash"></i> El saldo está en $0. ¿Pasamos la galería a <b>Entrega final</b>?</div>`:""}
  <div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:10px"><div class="mt"><div class="l">Fotos</div><div style="font-weight:600">${g.total||0}</div></div><div class="mt"><div class="l">Visitas</div><div style="font-weight:600">${g.vistas||0}</div></div><div class="mt clk" onclick="galFavs('${g.id}')"><div class="l">Favoritas</div><div style="font-weight:600;color:var(--mag)">${(g.favoritos||[]).length} <i class="ti ti-chevron-right sm"></i></div></div></div>
  <div style="display:flex;gap:6px;align-items:center;background:var(--soft);padding:8px 10px;border-radius:8px;margin-bottom:8px"><i class="ti ti-link muted"></i><span class="sm" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(galLink(g))}</span><button class="ic" title="Copiar link" onclick="navigator.clipboard.writeText('${galLink(g)}').then(()=>toast('Link copiado'))"><i class="ti ti-copy"></i></button></div>
  <div class="sm muted" style="margin-bottom:10px">${g.pin?`<i class="ti ti-lock"></i> PIN: <b>${esc(g.pin)}</b> · `:""}${g.vence?`Vence el ${fd(g.vence)} · `:""}${g.ultimaVista?"Última visita: "+new Date(g.ultimaVista).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):"El cliente todavía no la abrió"}</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="bp" onclick="galWa('${g.id}')"><i class="ti ti-brand-whatsapp"></i> Enviar al cliente</button><a href="${galLink(g)}" target="_blank" rel="noopener"><button><i class="ti ti-external-link"></i> Ver galería</button></a><button onclick="formGal('${t.id}')"><i class="ti ti-edit"></i> Editar</button><button onclick="galRefrescar('${g.id}')" title="Volver a leer la carpeta de Drive"><i class="ti ti-refresh"></i> Actualizar fotos</button></div></div>`;
}
let SA_MAIL="";
window.formGal=async tid=>{
  const t=S.tr.find(x=>x.id==tid),c=cli(t.clienteId),g=S.gal.find(x=>x.trabajoId==tid)||{};
  modal(`${head(g.id?"Editar galería":"Crear galería de fotos")}
  <div class="mt sm" style="color:var(--tx2);margin-bottom:6px"><b style="color:var(--deep)">Antes de pegar el link:</b> en Drive, abrí la carpeta → <b>Compartir</b> → agregá este email como <b>Editor</b> (no hace falta hacerla pública):<div style="display:flex;gap:6px;align-items:center;margin-top:6px"><code id="saem" style="background:#fff;padding:6px 8px;border-radius:6px;flex:1;overflow:hidden;text-overflow:ellipsis;font-size:12px">${esc(SA_MAIL||"cargando…")}</code><button class="ic" onclick="navigator.clipboard.writeText($('#saem').textContent).then(()=>toast('Email copiado'))"><i class="ti ti-copy"></i></button></div></div>
  <span class="lb">Link de la carpeta de Google Drive</span><input id="gc" value="${esc(g.carpetaUrl||"")}" placeholder="https://drive.google.com/drive/folders/...">
  <span class="lb">Título</span><input id="gt" value="${esc(g.titulo||c.nombre)}">
  <span class="lb">Subtítulo</span><input id="gs" value="${esc(g.subtitulo??(t.tipo+(t.fecha?" · "+fd(t.fecha):"")))}">
  <span class="lb">Mensaje para el cliente</span><textarea id="gm" rows="3" placeholder="Fue un placer acompañarte en una noche tan especial...">${esc(g.mensaje||"")}</textarea>
  <div class="g2"><div><span class="lb">PIN (opcional)</span><input id="gp" inputmode="numeric" maxlength="8" value="${esc(g.pin||"")}" placeholder="Sin PIN"></div><div><span class="lb">Vence (opcional)</span><input id="gv" type="date" value="${esc(g.vence||"")}"></div></div>
  <div class="err" id="ger"></div>
  <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="bp" id="gok"><i class="ti ti-check"></i> Guardar</button><button onclick="cerrar()">Cancelar</button>${g.id?`<button class="bd" style="margin-left:auto" onclick="galBorrar('${g.id}')"><i class="ti ti-trash"></i> Borrar galería</button>`:""}</div>`);
  if(!SA_MAIL)apiAdm({accion:"info"}).then(j=>{SA_MAIL=j.email;const e=$("#saem");if(e)e.textContent=SA_MAIL;}).catch(e=>{const x=$("#saem");if(x)x.textContent="No se pudo cargar: "+e.message;});
  $("#gok").onclick=async()=>{
    const er=m=>$("#ger").innerHTML=m;if(!$("#gc").value.trim())return er("Pegá el link de la carpeta de Drive");
    $("#gok").disabled=true;$("#gok").innerHTML='<i class="ti ti-loader-2"></i> Leyendo la carpeta...';
    try{const j=await apiAdm({accion:"guardar",slug:g.id||"",trabajoId:tid,carpeta:$("#gc").value,titulo:$("#gt").value,subtitulo:$("#gs").value,mensaje:$("#gm").value,pin:$("#gp").value,vence:$("#gv").value});
      cerrar();toast(`Galería lista: ${j.total} fotos`);}
    catch(e){er(e.message==="sin_acceso"?`No tengo acceso a esa carpeta. Compartila en Drive con <b>${esc(e.email)}</b> como Editor y probá de nuevo.`:esc(e.message));$("#gok").disabled=false;$("#gok").innerHTML='<i class="ti ti-check"></i> Guardar';}
  };
};
window.galModo=async(slug,modo)=>{const g=S.gal.find(x=>x.id==slug);if(g.modo===modo||(modo==="muestra"&&!g.modo))return;
  if(modo==="final"&&!confirm("¿Pasar a Entrega final? El cliente va a ver las fotos sin marca de agua y podrá descargar los originales."))return;
  try{await apiAdm({accion:"modo",slug,modo});toast(modo==="final"?"Entrega final activada":"Volvió a modo Muestra");}
  catch(e){alert(e.message==="necesita_editor"?"Para habilitar la descarga, compartí la carpeta de Drive con "+e.email+" como EDITOR (no solo lector).":"No se pudo: "+e.message);}};
window.galRefrescar=async slug=>{const g=S.gal.find(x=>x.id==slug);try{const j=await apiAdm({accion:"guardar",slug,trabajoId:g.trabajoId,carpeta:g.carpetaUrl,titulo:g.titulo,subtitulo:g.subtitulo,mensaje:g.mensaje,pin:g.pin,vence:g.vence});toast(`Actualizada: ${j.total} fotos`);}catch(e){toast("No se pudo: "+e.message);}};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const ETK=ET.map(e=>e[0]).join(", ");
window.voz=(trId)=>{
  const t=trId?S.tr.find(x=>x.id==trId):null;
  modal(`${head(t?"Agregar datos por voz":"Cargar trabajo por voz")}
  ${t?`<div class="sm muted" style="margin-bottom:6px">${esc(cli(t.clienteId).nombre)} · ${esc(t.tipo)}. Decí solo lo nuevo o lo que cambia, por ejemplo: "la fiesta es el 20 de marzo a las 22 en Las Palmeras".</div>`:`<div class="sm muted" style="margin-bottom:6px">Contá lo que te pidió el cliente: nombre, evento, fecha, lugar, servicio y precio si ya lo hablaron.</div>`}
  <button class="mic" id="micb" aria-label="Dictar"><i class="ti ti-microphone"></i></button>
  <div id="mst" class="sm muted" style="text-align:center;margin-bottom:8px">${SR?"Tocá el micrófono y hablá":"Usá el micrófono del teclado para dictar"}</div>
  <textarea id="vtx" rows="5" placeholder="Lo que dictes aparece acá. Podés corregirlo antes de procesar."></textarea>
  <div class="err" id="ver"></div>
  <button class="bp" id="vgo" style="width:100%;justify-content:center;padding:12px;margin-top:6px"><i class="ti ti-sparkles"></i> Procesar con IA</button>`);
  const tx=$("#vtx"),st=$("#mst"),mb=$("#micb");tx.oninput=()=>$("#ver").textContent="";
  mb.onclick=()=>{
    if(!SR){tx.focus();return;}
    if(rec){rec.stop();return;}
    const base=tx.value?tx.value.trim()+" ":"";
    rec=new SR();rec.lang="es-AR";rec.interimResults=true;rec.continuous=true;
    rec.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;tx.value=base+s;};
    rec.onstart=()=>{mb.classList.add("on");st.textContent="Escuchando... tocá de nuevo para terminar";};
    rec.onend=()=>{rec=null;mb.classList.remove("on");st.textContent="Listo. Revisá el texto y procesalo.";};
    rec.onerror=e=>{st.textContent=e.error=="not-allowed"?"Permití el micrófono en el navegador, o usá el del teclado.":"No se pudo usar el micrófono ("+e.error+").";};
    try{rec.start();}catch(e){rec=null;}
  };
  $("#vgo").onclick=async()=>{
    if(rec)rec.stop();
    const txt=tx.value.trim();if(!txt){$("#ver").textContent="Dictá o escribí algo primero";return;}
    const b=$("#vgo");b.disabled=true;b.innerHTML='<i class="ti ti-loader-2"></i> Procesando...';
    try{const r=await pedirIA(t?promptUpd(txt,t):promptNuevo(txt));t?revisarUpd(r,t,txt):revisarNuevo(r,txt);}
    catch(e){errIA(e);b.disabled=false;b.innerHTML='<i class="ti ti-sparkles"></i> Procesar con IA';}
  };
};
function errIA(e){const m=String(e?.message||e);const det=`<details style="margin-top:4px"><summary class="sm" style="cursor:pointer">Detalle técnico</summary><div class="sm" style="white-space:pre-wrap;word-break:break-word;color:var(--tx2)">${esc((e?.intentos||[m]).join("\n\n").slice(0,900))}</div></details>`;
  let msg="No se pudo procesar.";
  if(/app.?check|attestation/i.test(m))msg="La IA rechazó el pedido por la verificación de la app (App Check). Puede tardar unos minutos en aplicarse el cambio.";
  else if(/\b429\b|quota|RESOURCE_EXHAUSTED|rate.?limit/i.test(m))msg="Se alcanzó el límite gratuito de la IA por el momento. Probá en un rato.";
  else if(/\b403\b|permission|API key|not been used|disabled/i.test(m))msg="Google rechazó el pedido (permisos o API desactivada).";
  else if(/Failed to fetch|NetworkError|offline/i.test(m))msg="Sin conexión. Probá de nuevo cuando tengas señal.";
  $("#ver").innerHTML=esc(msg)+det;return null;}
async function pedirIA(prompt){
  const intentos=[];
  try{
    const tk=await auth.currentUser.getIdToken();
    const r=await fetch("/api/ia",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk},body:JSON.stringify({prompt})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok)return j.data;
    intentos.push("servidor: ["+r.status+"] "+(j.error||"")+(j.intentos?" → "+j.intentos.join(" | "):""));
  }catch(e){intentos.push("servidor: "+String(e?.message||e));}
  for(const model of MODELOS){
    try{
      const m=getGenerativeModel(ai,{model,generationConfig:{responseMimeType:"application/json",temperature:0.1}});
      const r=await m.generateContent(prompt);let s=r.response.text().trim().replace(/^```(json)?/,"").replace(/```$/,"");
      return JSON.parse(s);
    }catch(e){intentos.push(model+": "+String(e?.message||e));}
  }
  const err=new Error(intentos.join(" | "));err.intentos=intentos;throw err;
}
const ctxHoy=()=>{const d=new Date();return `Hoy es ${DIAS[d.getDay()]} ${hoy()}.`;};
const reglas=`Sos el asistente de un fotógrafo de eventos de Chaco, Argentina. Te paso un texto dictado por voz (puede tener errores de reconocimiento). Reglas:
- Corregí errores típicos de dictado: teléfonos partidos o con palabras ("tres 725-4539 05" → "3725 45-3905"; códigos de área locales como 3725, 362, 3734), "foto libro" → "fotolibro", montos ("1 millón" → 1000000, "150 mil" o "150 lucas" → 150000).
- Fechas relativas ("el sábado", "el próximo jueves", "el 12 de diciembre") resolvelas desde hoy. Si el día ya pasó este año, usá el año siguiente. "a la tarde" sin hora exacta → hora null.
- NO inventes datos. Lo que no se menciona va en null.
- Respondé SOLO con JSON válido, sin texto extra.`;

${ctxHoy()}
Clientes ya cargados (si el dictado se refiere claramente a uno, por nombre o teléfono, devolvé su id en clienteExistenteId): ${JSON.stringify(cls)}
Formato de respuesta:
{"clienteExistenteId":string|null,
 "cliente":{"nombre":"la persona del evento (ej. la quinceañera o los novios)"|null,"contacto":"quién habló si es otra persona (ej. 'Mamá de Camila')"|null,"telefono":string|null,"instagram":string|null,"origen":uno de ${JSON.stringify(ORIG)} o null},
 "trabajo":{"tipo":uno de ${JSON.stringify(TIPOS)},"etapa":uno de [${ETK}] (consulta si solo preguntó; presupuesto si ya hay precio pero sin seña; senado si pagó seña),"fecha":"AAAA-MM-DD"|null,"hora":"HH:MM"|null,"lugar":string|null,"servicio":"todos los servicios pedidos, separados por ' + '"|null,"acordado":"resumen breve de lo acordado y pendientes"|null,"total":número|null,"sena":número|null},
 "tarea":{"texto":"siguiente paso pendiente si se menciona (reunión, llamar, confirmar)","fecha":"AAAA-MM-DD (si no hay fecha, 3 días desde hoy)"}|null,
 "correcciones":["frases cortas: 'lo dictado' → 'lo interpretado'"]}
Texto dictado: """${txt}"""`;
}
function promptUpd(txt,t){
  const c=cli(t.clienteId);

  return `${reglas}
${ctxHoy()}
Este es un trabajo ya cargado: ${JSON.stringify(actual)}
El fotógrafo dictó datos nuevos o cambios. Devolvé SOLO los campos que cambian o se agregan.
Si agrega información a "acordado" o "servicio", devolvé el texto completo actualizado (lo anterior más lo nuevo).
Formato: {"cliente":{campos que cambian},"trabajo":{campos que cambian; también puede incluir "total" o "sena" (números) si se mencionan},"tarea":{"texto":string,"fecha":"AAAA-MM-DD"}|null,"correcciones":[string]}
Texto dictado: """${txt}"""`;
}

const LAB={nombre:"Nombre",telefono:"Teléfono",instagram:"Instagram",origen:"Cómo llegó",tipo:"Tipo de evento",etapa:"Etapa",fecha:"Fecha",hora:"Hora",lugar:"Lugar",servicio:"Servicio",acordado:"Lo acordado",total:"Total",sena:"Seña"};
function revisarUpd(ia,t,txt){
  const c=cli(t.clienteId);const cam=[];
  const okC=["nombre","telefono","instagram","origen"],okT=["tipo","etapa","fecha","hora","lugar","servicio","acordado"].concat(ADM()?["total","sena"]:[]);
  Object.entries(ia.cliente||{}).forEach(([k,v])=>{if(okC.includes(k)&&v!==null&&v!==""&&v!=c[k])cam.push({o:"cliente",k,antes:c[k],v});});
  Object.entries(ia.trabajo||{}).forEach(([k,v])=>{if(!okT.includes(k)||v===null||v==="")return;if(k=="etapa"&&!ET.some(e=>e[0]==v))return;
    const antes=k=="total"?fin(t).total:k=="sena"?null:t[k];if(v!=antes)cam.push({o:"trabajo",k,antes,v});});
  const sh=(k,v)=>v===null||v===undefined||v===""?'<span class="muted">vacío</span>':k=="etapa"?esc(et(v)[1]):k=="fecha"?fd(v):(k=="total"||k=="sena")?money(v):esc(v);
  if(!cam.length&&!(ia.tarea&&ia.tarea.texto)){$("#ver").textContent="No encontré datos nuevos en lo que dictaste. Probá decirlo de otra forma.";$("#vgo").disabled=false;$("#vgo").innerHTML='<i class="ti ti-sparkles"></i> Procesar con IA';return;}
  modal(`${head('<i class="ti ti-sparkles"></i> Cambios detectados')}
  <div class="sm muted" style="margin-bottom:6px">${esc(c.nombre)} · ${esc(t.tipo)}. Destildá lo que no quieras aplicar.</div>
  ${cam.map((x,i)=>`<label class="row" style="align-items:flex-start;cursor:pointer"><input type="checkbox" class="cx" data-i="${i}" checked style="width:18px;height:18px;margin-top:2px"><div style="flex:1;min-width:0"><div class="sm" style="font-weight:600">${LAB[x.k]||x.k}${x.k=="sena"?" (se registra como pago)":""}</div><div class="sm"><span style="text-decoration:line-through;color:var(--tx3)">${sh(x.k,x.antes)}</span> → <b style="color:var(--deep)">${sh(x.k,x.v)}</b></div></div></label>`).join("")}
  ${ia.tarea&&ia.tarea.texto?`<label class="row" style="cursor:pointer"><input type="checkbox" id="utk" checked style="width:18px;height:18px"><div class="sm" style="flex:1"><b>Nueva tarea:</b> ${esc(ia.tarea.texto)} · ${fd(ia.tarea.fecha||hoy())}</div></label>`:""}
  ${(ia.correcciones||[]).length?`<div class="mt sm" style="margin-top:10px;color:var(--tx2)"><b style="color:var(--deep)">Correcciones:</b> ${ia.correcciones.map(esc).join(" · ")}</div>`:""}
  <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="bp" id="uok"><i class="ti ti-check"></i> Aplicar cambios</button><button onclick="voz('${t.id}')"><i class="ti ti-microphone"></i> Volver a dictar</button></div>`);
  $("#uok").onclick=async()=>{
    const sel=[...document.querySelectorAll(".cx")].filter(x=>x.checked).map(x=>cam[+x.dataset.i]);
    const uc={},ut={};let total=null,sena=null;
    sel.forEach(x=>{if(x.o=="cliente")uc[x.k]=x.v;else if(x.k=="total")total=+x.v||0;else if(x.k=="sena")sena=+x.v||0;else ut[x.k]=x.v;});
    if(sena>0&&(t.etapa=="consulta"||t.etapa=="presupuesto")&&!ut.etapa)ut.etapa="senado";
    $("#uok").disabled=true;
    const ok=await guardar(async()=>{
      if(Object.keys(uc).length)await updateDoc(dref("clientes",c.id),{...uc,...firma()});
      if(Object.keys(ut).length)await updateDoc(dref("trabajos",t.id),{...ut,...firma()});
      if(ADM()&&(total!==null||sena)){const f={};if(total!==null)f.total=total;if(sena)f.pagos=[...(fin(t).pagos||[]),{monto:sena,fecha:hoy(),nota:"Seña"}];await setDoc(dref("finanzas",t.id),f,{merge:true});}
      if($("#utk")&&$("#utk").checked)await addDoc(col("tareas"),{texto:ia.tarea.texto,fecha:ia.tarea.fecha||hoy(),hecha:false,trabajoId:t.id,creado:serverTimestamp()});
    },"Cambios aplicados");
    if(ok)cerrar();else $("#uok").disabled=false;
  };
}

  const add=(rows,name)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{"(vacío)":""}]),name);
  add(S.cl.map(c=>({ID:c.id,Nombre:c.nombre,Teléfono:c.telefono,Instagram:c.instagram,"Cómo llegó":c.origen,Notas:c.notas})),"Clientes");
  add(S.tr.map(t=>({ID:t.id,Cliente:cli(t.clienteId).nombre,"ID cliente":t.clienteId,Tipo:t.tipo,Fecha:t.fecha,Hora:t.hora,Lugar:t.lugar,Servicio:t.servicio,Acordado:t.acordado,Etapa:et(t.etapa)[1],Total:+fin(t).total||0,Pagado:pagado(t),Saldo:saldo(t)})),"Trabajos");
  const pg=[];S.tr.forEach(t=>(fin(t).pagos||[]).forEach(p=>pg.push({Cliente:cli(t.clienteId).nombre,Trabajo:t.tipo+" "+fd(t.fecha),"ID trabajo":t.id,Fecha:p.fecha,Monto:+p.monto||0,Nota:p.nota})));add(pg,"Pagos");
  add(S.ta.map(t=>{const tr=S.tr.find(z=>z.id==t.trabajoId);return{Tarea:t.texto,Fecha:t.fecha,Hecha:t.hecha?"Sí":"No",Trabajo:tr?cli(tr.clienteId).nombre+" · "+tr.tipo:"","ID trabajo":t.trabajoId||""}}),"Tareas");
  XLSX.writeFile(wb,"backup-gustavo-torres-"+hoy()+".xlsx");toast("Backup descargado");
};
</script>
